data_dir: /var/lib/bard

# Inside the container, so the only thing that reaches it is the published port.
bind_addr: 0.0.0.0
port: 2273

# THE MOST IMPORTANT LINE IN THIS FILE.
#
# Docker publishes the port through its own NAT, so requests arrive from the
# bridge gateway rather than from the real client. Trusting nothing collapses
# every client into one rate-limit bucket; trusting too much lets a caller
# spoof its address past login rate limiting.
#
# Behind a tunnel or proxy that is itself in this compose project, trust the
# bridge network: ["172.16.0.0/12"]
# Published straight to the host with nothing in front: []
#
# /diagnostics in the admin UI shows what Bard actually resolves.
trusted_proxies: []

workers: 2
log_level: info

tls:
  mode: "off"

backup:
  enabled: true
  interval_hours: 24
  keep: 7
