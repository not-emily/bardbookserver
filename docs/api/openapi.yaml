openapi: 3.1.0

info:
  title: Bard
  version: 0.1.0
  summary: A self-hosted server for ebooks and audiobooks.
  description: |
    Bard serves its admin UI, this JSON API and the media itself from one
    origin on one port. A client points at the host and nothing else.

    **Authentication is a per-device bearer token.** `POST /auth/login`
    exchanges a username and password for one, and that token is presented as
    `Authorization: Bearer <token>` on every later request. Tokens are opaque
    and revocable: there is nothing to verify offline, because revocation that
    takes effect on the next request is worth more than statelessness here.

    **CSRF does not apply to this API.** It guards the cookie-authenticated
    browser session only, since a cross-site form cannot set an
    `Authorization` header. A native client never sends a CSRF token.

    **Content a reader may not see is absent rather than refused.** Where a
    source hides age-locked books, requesting one gives `404`, not `403` with
    a reason — a reason code would confirm the book exists.
  license:
    name: MIT
    identifier: MIT

servers:
  - url: https://bard.example.com
    description: Your own server, behind whichever transport you chose.

security:
  - deviceToken: []

tags:
  - name: Auth
    description: Logging in, the device token, and switching managed profiles.
  - name: Devices
    description: The authorized devices on an account, and revoking them.
  - name: Library
    description: Browsing, searching and filtering the whole collection.
  - name: Media
    description: Cover images and the book files themselves.
  - name: Collections
    description: |
      Admin-curated shelves everyone sees, and private ones a reader makes for
      themselves. `curated` is the difference, and only an admin can set it.
  - name: Annotations
    description: |
      Highlights, notes and bookmarks, synced by a client-chosen UUID so an
      offline device can create one without asking first.
  - name: Uploads
    description: |
      Adding a book from a phone, in resumable chunks. Admin-granted, and the
      one place Bard writes media.
  - name: Curation
    description: |
      Admin tools: correcting a wrong match, splitting or merging editions
      Bard grouped by guess, and granting a restricted reader one book.
  - name: Reading
    description: |
      Where a reader is, what they have shelved and rated, and what to
      pre-cache. Every one of these is private to the profile asking — no
      endpoint exposes one reader's space to another, including to an admin.

paths:
  /api/v1/auth/login:
    post:
      tags: [Auth]
      summary: Exchange credentials for a device token
      operationId: login
      security: []
      description: |
        The only unauthenticated endpoint. Rate limited per resolved client
        address, so a server whose `trusted_proxies` is wrong throttles every
        client as one — see `/diagnostics` in the admin UI.

        `device_name` is what the account holder sees in their authorized
        devices list, so it should name the device rather than the app.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: A new device token. Store it; it is not retrievable again.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          description: Username or password missing, or a malformed body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: Invalid credentials. Deliberately not distinguished from an unknown username.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          description: Too many attempts. `Retry-After` carries the wait in seconds.
          headers:
            Retry-After:
              description: Seconds to wait before trying again.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke this device
      operationId: logout
      description: |
        Revokes the token that made the request, so logging out is permanent
        rather than a client-side forget. Discard the token afterwards.
      responses:
        '204':
          description: Revoked. The token is dead from the next request.

  /api/v1/auth/me:
    get:
      tags: [Auth]
      summary: The current profile, device, and who else this device may become
      operationId: me
      description: |
        `user` is who the device is reading as now, which may be a managed
        profile rather than the account that signed in. `profiles` is what
        `POST /auth/switch` will accept, and is how a client draws a profile
        picker without a second request.
      responses:
        '200':
          description: The session as the server sees it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'

  /api/v1/auth/switch:
    post:
      tags: [Auth]
      summary: Read as a different profile on this device
      operationId: switchProfile
      description: |
        Switches which profile the device is reading as. No new token is
        issued — the device is the identity, and the active profile is a
        property of it.

        A profile with `has_pin` needs `pin`. PIN attempts are rate limited
        per device and profile.

        A profile that does not exist is refused exactly as one belonging to
        another household would be, so a probe cannot tell the two apart.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SwitchRequest'
      responses:
        '200':
          description: The profile now active on this device.
          content:
            application/json:
              schema:
                type: object
                required: [user]
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '400':
          description: A malformed body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not switchable from this device, or a missing or wrong PIN.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Denied'
        '429':
          description: Too many PIN attempts.
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/devices:
    get:
      tags: [Devices]
      summary: List authorized devices
      operationId: listDevices
      responses:
        '200':
          description: Every device holding a live token for this account.
          content:
            application/json:
              schema:
                type: object
                required: [devices]
                properties:
                  devices:
                    type: array
                    items:
                      $ref: '#/components/schemas/Device'

  /api/v1/devices/{id}:
    delete:
      tags: [Devices]
      summary: Revoke a device
      operationId: revokeDevice
      description: Takes effect on that device's next request. Revoking your own logs you out.
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '204':
          description: Revoked.
        '403':
          description: Not your device to revoke.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Denied'
        '404':
          description: No such device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/books:
    get:
      tags: [Library]
      summary: Browse the library
      operationId: listBooks
      description: |
        The main listing. Filters are facet names repeated as query
        parameters: values of one facet are OR'd, different facets are AND'd,
        so `?genre=fantasy&genre=sci-fi&format=epub` means *(fantasy or
        sci-fi) and epub*.

        An unknown parameter is a `400` rather than a filter that silently
        matches everything.

        What a restricted reader may not see never appears here, because
        visibility is part of the query rather than a filter applied after
        paging. A book that is locked but visible comes back with `locked`
        and `required_age` set.
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Facets'
      responses:
        '200':
          description: One page of books.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookPage'
        '400':
          description: An unknown filter, an out-of-range limit, or an unknown sort.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/books/{id}:
    get:
      tags: [Library]
      summary: One book, with its editions and files
      operationId: getBook
      description: |
        The detail a reader opens: description, genres, tags, and every
        edition with its files and chapters. `editions[].files[].content_url`
        is what to stream.
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: The book.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookDetail'
        '404':
          description: |
            No such book — or one hidden from this reader. The two are
            deliberately indistinguishable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/books/{id}/cover:
    get:
      tags: [Media]
      summary: Cover image
      operationId: bookCover
      description: |
        Served from a cache of pre-scaled variants. `width` picks the smallest
        variant at least that wide; omitting it gives the full-size image.
        Carries an `ETag`, so a conditional request is cheap.
      parameters:
        - $ref: '#/components/parameters/ID'
        - name: width
          in: query
          description: Desired width in pixels, 1 to 4000. Omit for full size.
          schema:
            type: integer
            minimum: 1
            maximum: 4000
      responses:
        '200':
          description: The image.
          headers:
            ETag:
              schema:
                type: string
          content:
            image/jpeg: {}
            image/png: {}
        '304':
          description: Unchanged since the `ETag` you presented.
        '400':
          description: Width out of range.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: That book has no cover, or is not visible to this reader.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/files/{id}/content:
    get:
      tags: [Media]
      summary: Stream or download a book file
      operationId: fileContent
      description: |
        The bytes, exactly as they are on disk — **nothing is ever
        transcoded**. M4B is AAC in an MP4 container and plays natively.

        Range requests are supported and are how an audio player seeks;
        `Accept-Ranges: bytes` is always sent. `ETag` and `If-Range` work, so
        a resumed download cannot splice two different files together.
      parameters:
        - $ref: '#/components/parameters/ID'
        - name: Range
          in: header
          description: A byte range, e.g. `bytes=0-1048575`.
          schema:
            type: string
      responses:
        '200':
          description: The whole file.
          headers:
            Accept-Ranges:
              schema:
                type: string
            ETag:
              schema:
                type: string
            Content-Disposition:
              schema:
                type: string
          content:
            application/octet-stream: {}
        '206':
          description: The requested range.
          headers:
            Content-Range:
              schema:
                type: string
          content:
            application/octet-stream: {}
        '404':
          description: No such file, or not visible to this reader.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '416':
          description: The range lies outside the file.

  /api/v1/search:
    get:
      tags: [Library]
      summary: Search the library
      operationId: search
      description: |
        Full-text search over **metadata** — titles, authors, series,
        narrators — not the text inside books. Accepts the same filters,
        sorting and paging as `GET /books`, so a search can be narrowed by
        facet.
      parameters:
        - name: q
          in: query
          required: true
          description: The search terms.
          schema:
            type: string
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/Facets'
      responses:
        '200':
          description: Matching books, in the same envelope as a listing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookPage'
        '400':
          description: A missing query, an unknown filter, or a bad page.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/facets:
    get:
      tags: [Library]
      summary: Every facet and its values
      operationId: listFacets
      description: |
        What a filter UI is drawn from. Counts are computed over the books the
        reader may already see and over any filters supplied, so refining a
        search updates the remaining counts — and no count can reveal a book
        that is hidden.
      parameters:
        - $ref: '#/components/parameters/Facets'
      responses:
        '200':
          description: Facet names mapped to their values.
          content:
            application/json:
              schema:
                type: object
                required: [facets]
                properties:
                  facets:
                    type: object
                    description: Keyed by facet name.
                    additionalProperties:
                      type: array
                      items:
                        $ref: '#/components/schemas/FacetValue'

  /api/v1/facets/{name}:
    get:
      tags: [Library]
      summary: One facet's values
      operationId: getFacet
      parameters:
        - name: name
          in: path
          required: true
          description: One of the facet names.
          schema:
            type: string
            enum: [author, format, genre, kind, language, length, narrator, rating, reading_state, saved, series, year]
        - $ref: '#/components/parameters/Facets'
      responses:
        '200':
          description: The facet's values.
          content:
            application/json:
              schema:
                type: object
                required: [facet, values]
                properties:
                  facet:
                    type: string
                  values:
                    type: array
                    items:
                      $ref: '#/components/schemas/FacetValue'
        '404':
          description: No such facet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/series:
    get:
      tags: [Library]
      summary: List series
      operationId: listSeries
      responses:
        '200':
          description: Every series with at least one visible book.
          content:
            application/json:
              schema:
                type: object
                required: [series]
                properties:
                  series:
                    type: array
                    items:
                      $ref: '#/components/schemas/Series'

  /api/v1/series/{id}:
    get:
      tags: [Library]
      summary: One series and its books
      operationId: getSeries
      description: Books come back in series order, which is what `position` is for.
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: The series and one page of its books.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BookPage'
                  - type: object
                    required: [series]
                    properties:
                      series:
                        $ref: '#/components/schemas/Series'
        '404':
          description: No such series.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/editions/{id}/progress:
    get:
      tags: [Reading]
      summary: Where every device is in this edition
      operationId: getProgress
      description: |
        Positions are kept **per device and never resolved into one**. A
        client shows where this device was, and surfaces the others when they
        disagree rather than silently adopting the newest.
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Every device's position in this edition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Progress'
        '404':
          description: No such edition, or not visible to this reader.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

    put:
      tags: [Reading]
      summary: Report this device's position
      operationId: setProgress
      description: |
        Send the position for whichever kind of edition this is: `cfi` and
        `page` for an ebook, `seconds` and `file_index` for an audiobook.
        `percent` is required either way and is what cross-edition handoff and
        sorting use.

        `client_seq` is the device's own counter, incremented per save. It is
        what makes divergence detectable: a device reporting a sequence that
        does not follow from what the server last saw from it means the two
        were edited apart, and the reply comes back with `diverged` set and
        **both** positions kept.
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgressRequest'
      responses:
        '200':
          description: The stored positions, including this one.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Progress'
        '400':
          description: A malformed body, or a percent outside 0 to 1.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such edition, or not visible to this reader.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/books/{id}/saved:
    put:
      tags: [Reading]
      summary: Add to the saved shelf
      operationId: saveBook
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: The book's state for this reader.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReaderState'
        '404':
          description: No such book, or not visible to this reader.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Reading]
      summary: Remove from the saved shelf
      operationId: unsaveBook
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: The book's state for this reader.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReaderState'
        '404':
          description: No such book, or not visible to this reader.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/books/{id}/rating:
    put:
      tags: [Reading]
      summary: Rate a book
      operationId: setRating
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rating]
              properties:
                rating:
                  type: [integer, 'null']
                  minimum: 1
                  maximum: 5
                  description: Null clears it, which is the same as DELETE.
      responses:
        '200':
          description: The book's state for this reader.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReaderState'
        '400':
          description: A rating outside 1 to 5.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such book, or not visible to this reader.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Reading]
      summary: Clear a rating
      operationId: clearRating
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: The book's state for this reader.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReaderState'
        '404':
          description: No such book, or not visible to this reader.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/books/{id}/state:
    put:
      tags: [Reading]
      summary: Mark finished or abandoned
      operationId: setState
      description: |
        Only the two states a person sets by hand. `unread` and `reading`
        derive from progress, so there is nothing to set them to — send
        `null` to clear a mark and let progress speak again.

        `reading_state` in the reply is the derived answer, which is not
        always what was marked.
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state:
                  type: [string, 'null']
                  enum: [finished, abandoned, null]
      responses:
        '200':
          description: The book's state for this reader.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReaderState'
        '400':
          description: A state other than finished, abandoned or null.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such book, or not visible to this reader.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/history:
    get:
      tags: [Reading]
      summary: Books this reader has finished
      operationId: history
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Finished books, most recent first.
          content:
            application/json:
              schema:
                type: object
                required: [history, total, limit, offset]
                properties:
                  history:
                    type: array
                    items:
                      $ref: '#/components/schemas/HistoryEntry'
                  total:
                    type: integer
                  limit:
                    type: integer
                  offset:
                    type: integer

  /api/v1/sync:
    get:
      tags: [Reading]
      summary: What this reader would want held offline
      operationId: sync
      description: |
        A manifest, not an instruction. The server says what is worth caching
        and why; **the client decides what to hold**, because only the device
        knows its storage, battery and network — and nothing here is licensed,
        so there is nothing to revoke.

        `total_bytes` is the whole manifest, for showing a cost before
        downloading.
      responses:
        '200':
          description: Editions worth pre-caching.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncManifest'

  /api/v1/books/{id}/handoff:
    get:
      tags: [Reading]
      summary: Where you would land in each other edition
      operationId: bookHandoffTargets
      description: |
        For drawing "continue in…": every edition of the book with the
        position this reader would arrive at, so a client can offer the switch
        before committing to it.
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Each edition and the position it would open at.
          content:
            application/json:
              schema:
                type: object
                required: [book_id, editions]
                properties:
                  book_id:
                    type: integer
                    format: int64
                  editions:
                    type: array
                    items:
                      $ref: '#/components/schemas/HandoffTarget'
        '404':
          description: No such book, or not visible to this reader.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/editions/{id}/handoff:
    post:
      tags: [Reading]
      summary: Carry a position into another edition
      operationId: handoff
      description: |
        Read, then listen. Maps a position in this edition onto another one —
        by aligning chapter lists where both have them, and falling back to
        proportion where they cannot be aligned. `method` says which happened,
        which is worth showing: a proportional jump in a sixteen-hour
        audiobook can be minutes out.

        Omit `percent` to hand off from this reader's own stored position,
        which is the usual case.
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HandoffRequest'
      responses:
        '200':
          description: Where to open the target edition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Handoff'
        '400':
          description: A malformed body, or a target that is not an edition of the same book.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such edition, or not visible to this reader.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/collections:
    get:
      tags: [Collections]
      summary: List collections
      operationId: listCollections
      description: Curated collections, plus this reader's own.
      responses:
        '200':
          description: The collections visible to this reader.
          content:
            application/json:
              schema:
                type: object
                required: [collections]
                properties:
                  collections:
                    type: array
                    items:
                      $ref: '#/components/schemas/Collection'
    post:
      tags: [Collections]
      summary: Create a collection
      operationId: createCollection
      description: '`curated` is admin-only; a reader creating one gets a private collection.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionRequest'
      responses:
        '201':
          description: The new collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '400':
          description: A missing or empty name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not allowed to curate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Denied'

  /api/v1/collections/{id}:
    get:
      tags: [Collections]
      summary: One collection and its books
      operationId: getCollection
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: The collection and one page of its books.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BookPage'
                  - type: object
                    required: [collection]
                    properties:
                      collection:
                        $ref: '#/components/schemas/Collection'
        '404':
          description: No such collection, or not this reader's to see.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    patch:
      tags: [Collections]
      summary: Rename or describe a collection
      operationId: updateCollection
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CollectionRequest'
      responses:
        '200':
          description: The updated collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '400':
          description: An empty name.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not this reader's to change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Denied'
        '404':
          description: No such collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Collections]
      summary: Delete a collection
      operationId: deleteCollection
      description: Removes the shelf, never the books on it.
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted:
                    type: integer
                    format: int64
        '403':
          description: Not this reader's to delete.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Denied'
        '404':
          description: No such collection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/collections/{id}/books/{bookID}:
    put:
      tags: [Collections]
      summary: Add a book to a collection
      operationId: addToCollection
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/BookID'
      responses:
        '200':
          description: The collection, with its count updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '403':
          description: Not this reader's to change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Denied'
        '404':
          description: No such collection or book.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Collections]
      summary: Remove a book from a collection
      operationId: removeFromCollection
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/BookID'
      responses:
        '200':
          description: The collection, with its count updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Collection'
        '403':
          description: Not this reader's to change.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Denied'
        '404':
          description: No such collection or book.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/annotations:
    get:
      tags: [Annotations]
      summary: Annotations in one edition
      operationId: listAnnotations
      parameters:
        - name: edition_id
          in: query
          required: true
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: This reader's annotations in that edition.
          content:
            application/json:
              schema:
                type: object
                required: [edition_id, annotations]
                properties:
                  edition_id:
                    type: integer
                    format: int64
                  annotations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Annotation'
        '400':
          description: A missing or unparseable edition_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/annotations/changes:
    get:
      tags: [Annotations]
      summary: What changed since a cursor
      operationId: annotationChanges
      description: |
        The offline sync feed. Pass the `cursor` from the previous reply;
        `more` says whether to ask again straight away. Deletions come back
        as tombstones with `deleted` set, so a device that was away learns
        about them rather than resurrecting what it still holds.
      parameters:
        - name: since
          in: query
          description: The last cursor seen. Omit or send 0 for everything.
          schema:
            type: integer
            format: int64
            default: 0
        - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Changes in sequence order.
          content:
            application/json:
              schema:
                type: object
                required: [annotations, cursor, more]
                properties:
                  annotations:
                    type: array
                    items:
                      $ref: '#/components/schemas/Annotation'
                  cursor:
                    type: integer
                    format: int64
                    description: Send this as `since` next time.
                  more:
                    type: boolean

  /api/v1/annotations/{uuid}:
    put:
      tags: [Annotations]
      summary: Create or update an annotation
      operationId: saveAnnotation
      description: |
        The UUID is chosen by the client, which is what lets an offline device
        create an annotation and sync it later without negotiating an id.
        Sending the same UUID again updates it.
      parameters:
        - $ref: '#/components/parameters/UUID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnnotationRequest'
      responses:
        '200':
          description: The stored annotation.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Annotation'
        '400':
          description: A bad UUID, an unknown kind, or a malformed body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such edition, or not visible to this reader.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Annotations]
      summary: Delete an annotation
      operationId: deleteAnnotation
      description: Leaves a tombstone, so other devices learn of the deletion.
      parameters:
        - $ref: '#/components/parameters/UUID'
      responses:
        '200':
          description: Deleted.
          content:
            application/json:
              schema:
                type: object
                required: [deleted]
                properties:
                  deleted:
                    type: string
        '404':
          description: No such annotation of this reader's.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/uploads:
    post:
      tags: [Uploads]
      summary: Begin a resumable upload
      operationId: createUpload
      description: |
        Opens a session and tells you the chunk size to use. Send `sha256` of
        the whole file up front; finalizing verifies it.

        The size limit is refused here, before any bytes are sent. An
        abandoned session is reaped after the configured TTL, which is what
        stops a half-sent audiobook holding the disk.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadRequest'
      responses:
        '201':
          description: The session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
        '400':
          description: A malformed body, an unsupported format, or a size over the limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: This account may not upload.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Denied'
        '404':
          description: No such source.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: That source cannot be written to.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/uploads/{id}:
    get:
      tags: [Uploads]
      summary: Session state, and which chunks are still missing
      operationId: uploadStatus
      description: What a resuming client asks for before sending anything.
      parameters:
        - $ref: '#/components/parameters/UploadID'
      responses:
        '200':
          description: The session.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
        '404':
          description: No such session of this account's.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/uploads/{id}/chunks/{offset}:
    put:
      tags: [Uploads]
      summary: Send one chunk
      operationId: uploadChunk
      description: |
        The body is the raw bytes. `offset` must land on a chunk boundary —
        an arbitrary range is refused, because resume is defined in whole
        chunks. Re-sending a chunk already held is accepted and changes
        nothing, so a client that lost its reply can simply repeat it.
      parameters:
        - $ref: '#/components/parameters/UploadID'
        - name: offset
          in: path
          required: true
          description: Byte offset, which must be a multiple of `chunk_bytes`.
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/octet-stream: {}
      responses:
        '200':
          description: The session, with this chunk no longer missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
        '400':
          description: An offset off a boundary, or a chunk of the wrong length.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such session of this account's.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The session is finalized or failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/uploads/{id}/finalize:
    post:
      tags: [Uploads]
      summary: Assemble and ingest
      operationId: finalizeUpload
      description: |
        Verifies the SHA-256 over the assembled bytes, then moves the file
        into the source. The move is a rename within the same filesystem, so
        a scan never sees a half-written book.
      parameters:
        - $ref: '#/components/parameters/UploadID'
      responses:
        '200':
          description: Ingested.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Upload'
        '400':
          description: Chunks are still missing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: No such session of this account's.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: The bytes do not match the declared SHA-256, or the name is taken.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/books/{id}/match:
    get:
      tags: [Curation]
      summary: Metadata candidates for a book
      operationId: searchMatches
      description: |
        Ranked candidates from the enabled providers, **including the ones the
        automatic matcher refused** — `would_match_automatically` says which
        those are, because a human can recognise a match a score cannot.

        `q` and `author` search for something else entirely, for when the
        indexed metadata is too wrong to find the right book.
      parameters:
        - $ref: '#/components/parameters/ID'
        - name: q
          in: query
          description: Search for a different title instead of the indexed one.
          schema:
            type: string
        - name: author
          in: query
          schema:
            type: string
        - name: edition_id
          in: query
          description: Which edition to match; defaults to the book's primary.
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Ranked candidates.
          content:
            application/json:
              schema:
                type: object
                required: [book_id, candidates]
                properties:
                  book_id:
                    type: integer
                    format: int64
                  edition_id:
                    type: integer
                    format: int64
                  candidates:
                    type: array
                    items:
                      $ref: '#/components/schemas/Candidate'
        '403':
          description: Not allowed to curate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Denied'
        '404':
          description: No such book.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: No metadata provider is enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    post:
      tags: [Curation]
      summary: Apply a candidate
      operationId: applyMatch
      description: |
        Pins the chosen candidate and **locks the fields it set**, so the next
        scan cannot overwrite the correction. The lock is written to the
        sidecar as well, which is what makes it survive rebuilding the index.
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ApplyMatchRequest'
      responses:
        '200':
          description: Applied and locked.
          content:
            application/json:
              schema:
                type: object
                required: [book_id, edition_id, provider, id, locked]
                properties:
                  book_id:
                    type: integer
                    format: int64
                  edition_id:
                    type: integer
                    format: int64
                  provider:
                    type: string
                  id:
                    type: string
                  locked:
                    type: boolean
        '400':
          description: A malformed body, or a candidate that no longer resolves.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not allowed to curate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Denied'
        '404':
          description: No such book or edition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: No metadata provider is enabled.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Curation]
      summary: Unpin a match
      operationId: clearMatch
      description: |
        Unpins and unlocks, **including in the sidecar** — a lock left there
        would keep outranking the file forever.
      parameters:
        - $ref: '#/components/parameters/ID'
        - name: edition_id
          in: query
          schema:
            type: integer
            format: int64
      responses:
        '200':
          description: Unpinned.
          content:
            application/json:
              schema:
                type: object
                required: [edition_id, pinned]
                properties:
                  edition_id:
                    type: integer
                    format: int64
                  pinned:
                    type: boolean
        '403':
          description: Not allowed to curate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Denied'
        '404':
          description: No such book or edition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/groupings/uncertain:
    get:
      tags: [Curation]
      summary: Groupings Bard is unsure about
      operationId: listUncertainGroupings
      description: The review queue for editions matched below the confidence threshold.
      responses:
        '200':
          description: Uncertain groupings, least confident first.
          content:
            application/json:
              schema:
                type: object
                required: [groupings]
                properties:
                  groupings:
                    type: array
                    items:
                      $ref: '#/components/schemas/UncertainGrouping'
        '403':
          description: Not allowed to curate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Denied'

  /api/v1/editions/{id}/group:
    post:
      tags: [Curation]
      summary: Move an edition onto another book
      operationId: mergeEdition
      description: A manual decision, which a rescan will not undo.
      parameters:
        - $ref: '#/components/parameters/ID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [book_id]
              properties:
                book_id:
                  type: integer
                  format: int64
      responses:
        '200':
          description: Where the edition now sits.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grouping'
        '400':
          description: A malformed body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not allowed to curate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Denied'
        '404':
          description: No such edition or book.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Curation]
      summary: Split an edition onto a book of its own
      operationId: splitEdition
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: The new book the edition was moved to.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Grouping'
        '403':
          description: Not allowed to curate.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Denied'
        '404':
          description: No such edition.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: That edition is already alone on its book.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/users/{id}/overrides:
    get:
      tags: [Curation]
      summary: A reader's per-book age exceptions
      operationId: listOverrides
      parameters:
        - $ref: '#/components/parameters/ID'
      responses:
        '200':
          description: Every book this reader has an exception for.
          content:
            application/json:
              schema:
                type: object
                required: [overrides]
                properties:
                  overrides:
                    type: array
                    items:
                      $ref: '#/components/schemas/Override'
        '403':
          description: Not yours to see.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Denied'
        '404':
          description: No such account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /api/v1/users/{id}/overrides/{bookID}:
    put:
      tags: [Curation]
      summary: Grant or refuse one book
      operationId: setOverride
      description: |
        An exception for a single book, which outranks the age gate in both
        directions: `allowed` true opens a book the reader's age would lock,
        false closes one it would not.
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/BookID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [allowed]
              properties:
                allowed:
                  type: boolean
      responses:
        '200':
          description: The override.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Override'
        '400':
          description: A malformed body.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '403':
          description: Not yours to set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Denied'
        '404':
          description: No such account or book.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      tags: [Curation]
      summary: Clear an exception
      operationId: clearOverride
      description: The book falls back to the ordinary age gate.
      parameters:
        - $ref: '#/components/parameters/ID'
        - $ref: '#/components/parameters/BookID'
      responses:
        '200':
          description: Cleared.
          content:
            application/json:
              schema:
                type: object
                required: [user_id, book_id]
                properties:
                  user_id:
                    type: integer
                    format: int64
                  book_id:
                    type: integer
                    format: int64
        '403':
          description: Not yours to clear.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Denied'
        '404':
          description: No such account or book.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

components:
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

    BookID:
      name: bookID
      in: path
      required: true
      schema:
        type: integer
        format: int64

    UUID:
      name: uuid
      in: path
      required: true
      description: Chosen by the client, so an offline device can create one.
      schema:
        type: string
        format: uuid

    UploadID:
      name: id
      in: path
      required: true
      schema:
        type: string

    Limit:
      name: limit
      in: query
      description: Page size, 1 to 200. Defaults to 50.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50

    Offset:
      name: offset
      in: query
      description: How many to skip.
      schema:
        type: integer
        minimum: 0
        default: 0

    Sort:
      name: sort
      in: query
      description: |
        Ordering. Readable books always come before locked ones whatever is
        chosen, so a locked book never heads a list.
      schema:
        type: string
        enum: [added, author, length, published, rating, reading, saved, series, title]
        default: title

    Facets:
      name: facet
      in: query
      description: |
        **Not a literal parameter.** Each facet name is its own repeatable
        query parameter — `genre`, `format`, `author`, and so on. Repeating
        one ORs its values; different facets are AND'd. An unrecognised name
        is a `400`.
      required: false
      schema:
        type: string
      examples:
        oneGenre:
          summary: One genre
          value: genre=science-fiction
        several:
          summary: Two genres and a format
          value: genre=science-fiction&genre=fantasy&format=epub

  securitySchemes:
    deviceToken:
      type: http
      scheme: bearer
      description: |
        The opaque token from `POST /auth/login`, sent as
        `Authorization: Bearer <token>`. Revoking the device in the admin UI
        takes effect on the next request.

  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Human-readable, and not intended for matching on.
      examples:
        - error: invalid credentials

    Denied:
      type: object
      description: |
        An authorization failure that the reader is allowed to know about.
        `reason` is the stable code to branch on; extra properties carry
        whatever that reason needs, such as the age a book requires.
      required: [error, reason]
      properties:
        error:
          type: string
        reason:
          type: string
          description: |
            A stable code; `error` is the sentence for a person. A reason is
            only ever given for something the reader already knows exists —
            hidden content is a `404` with no reason at all.
          enum:
            - not_admin
            - not_owner
            - managed_user
            - pin_required
            - pin_incorrect
            - not_switchable
            - explicitly_denied
            - below_min_age
            - unrated
            - upload_not_allowed
      additionalProperties: true

    User:
      type: object
      required: [id, username, display_name, is_admin, restricted, managed, can_upload, has_pin]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        display_name:
          type: string
        is_admin:
          type: boolean
        restricted:
          type: boolean
          description: Subject to age gating.
        managed:
          type: boolean
          description: A passwordless profile switched into from its owner's device.
        can_upload:
          type: boolean
        has_pin:
          type: boolean
          description: Whether switching into this profile asks for a PIN.
        age:
          type: integer
          description: Present only when a birth date is set. Absent is not zero.

    Device:
      type: object
      required: [id, name, active_user_id, created_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        active_user_id:
          type: integer
          format: int64
          description: The profile this device is currently reading as, which may be a managed user.
        last_seen_ip:
          type: string
          description: Recorded for the owner's devices list. Never used as identity.
        last_seen_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password
        device_name:
          type: string
          description: Shown in the authorized devices list, e.g. "Emily's iPhone".
      examples:
        - username: emily
          password: a long enough phrase
          device_name: Emily's iPhone

    LoginResponse:
      type: object
      required: [token, user, device]
      properties:
        token:
          type: string
          description: Opaque. Shown once, stored hashed, and revocable.
        user:
          $ref: '#/components/schemas/User'
        device:
          $ref: '#/components/schemas/Device'

    Session:
      type: object
      required: [user, device, profiles]
      properties:
        user:
          $ref: '#/components/schemas/User'
        device:
          $ref: '#/components/schemas/Device'
        profiles:
          type: array
          description: Who this device may switch to, including the current profile.
          items:
            $ref: '#/components/schemas/User'

    SwitchRequest:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: integer
          format: int64
        pin:
          type: string
          description: Required when the target profile has one.

    SeriesRef:
      type: object
      description: A book's place in a series, as carried on the book itself.
      required: [id, name]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        position:
          type: number
          description: A number so a novella can sit at 1.5.

    Series:
      type: object
      required: [id, name, book_count]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        book_count:
          type: integer
          description: Counts only what this reader may see.

    Book:
      type: object
      description: |
        A book as it appears in a listing. Per-reader fields — `reading_state`,
        `percent`, `saved`, `rating` — belong to whoever is asking and are
        never another profile's.
      required: [id, title, sort_title, authors, formats, kinds, edition_count, has_cover, added_at, reading_state, saved]
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        subtitle:
          type: string
        sort_title:
          type: string
          description: Articles moved to the end, which is what to sort on.
        authors:
          type: array
          items:
            type: string
        narrators:
          type: array
          items:
            type: string
        series:
          $ref: '#/components/schemas/SeriesRef'
        formats:
          type: array
          description: e.g. epub, pdf, m4b, mp3.
          items:
            type: string
        kinds:
          type: array
          description: ebook, audiobook, or both when a book has editions of each.
          items:
            type: string
        languages:
          type: array
          items:
            type: string
        edition_count:
          type: integer
        duration_seconds:
          type: number
          description: Longest audiobook edition, when there is one.
        page_count:
          type: integer
        published_on:
          type: string
          description: The earliest edition's date; may be a year alone.
        has_cover:
          type: boolean
        uncertain_grouping:
          type: boolean
          description: Bard grouped these editions by guess, so say so rather than present it as settled.
        added_at:
          type: string
          format: date-time
        reading_state:
          type: string
          enum: [unread, reading, finished, abandoned]
        percent:
          type: number
          description: Furthest position reached, 0 to 1. Absent when never opened.
        saved:
          type: boolean
        rating:
          type: integer
        locked:
          type: boolean
          description: |
            Visible but age-gated for this reader. Where a source hides locked
            books instead, they are absent entirely rather than marked.
        required_age:
          type: integer
          description: Present only when `locked`, so a client can say what it unlocks at.

    BookDetail:
      allOf:
        - $ref: '#/components/schemas/Book'
        - type: object
          required: [editions]
          properties:
            description:
              type: string
            genres:
              type: array
              items:
                $ref: '#/components/schemas/Genre'
            tags:
              type: array
              description: Subject strings no canonical genre was mapped from.
              items:
                type: string
            editions:
              type: array
              items:
                $ref: '#/components/schemas/Edition'

    BookPage:
      type: object
      required: [books, total, limit, offset]
      properties:
        books:
          type: array
          items:
            $ref: '#/components/schemas/Book'
        total:
          type: integer
          description: Matches before paging, counting only what this reader may see.
        limit:
          type: integer
        offset:
          type: integer

    Genre:
      type: object
      required: [name, slug]
      properties:
        name:
          type: string
        slug:
          type: string
          description: What the `genre` facet filters on.

    Edition:
      type: object
      description: One manifestation of a book — the EPUB, a particular narration, an abridgement.
      required: [id, format, kind, abridged, files]
      properties:
        id:
          type: integer
          format: int64
        format:
          type: string
        kind:
          type: string
          enum: [ebook, audiobook]
        language:
          type: string
        publisher:
          type: string
        published_on:
          type: string
        isbn:
          type: string
        asin:
          type: string
        page_count:
          type: integer
        duration_seconds:
          type: number
        abridged:
          type: boolean
        narrators:
          type: array
          items:
            type: string
        uncertain_grouping:
          type: boolean
        files:
          type: array
          description: More than one for an audiobook split across tracks, in `ordinal` order.
          items:
            $ref: '#/components/schemas/File'
        chapters:
          type: array
          items:
            $ref: '#/components/schemas/Chapter'

    File:
      type: object
      required: [id, ordinal, size_bytes, etag, content_url]
      properties:
        id:
          type: integer
          format: int64
        ordinal:
          type: integer
          description: Playback order within the edition, from 1.
        size_bytes:
          type: integer
          format: int64
        duration_seconds:
          type: number
        etag:
          type: string
          description: Use with `If-Range` so a resumed download cannot splice two files.
        content_url:
          type: string
          description: Path to stream from, relative to the server.

    Chapter:
      type: object
      required: [ordinal]
      properties:
        ordinal:
          type: integer
        title:
          type: string
        start_seconds:
          type: number
          description: Audiobook chapters. Offset within the edition, not the file.
        href:
          type: string
          description: EPUB chapters. A link into the book's own contents.

    Position:
      type: object
      description: One device's place in an edition.
      required: [edition_id, device_id, device_name, percent, client_seq, this_device, updated_at]
      properties:
        edition_id:
          type: integer
          format: int64
        device_id:
          type: integer
          format: int64
        device_name:
          type: string
          description: So a divergence can name the device rather than a number.
        this_device:
          type: boolean
          description: Whether this is the position of the device that asked.
        percent:
          type: number
          description: 0 to 1, and the only field every edition kind has.
        cfi:
          type: string
          description: EPUB position.
        page:
          type: integer
          description: PDF page, or an EPUB's rendered page where one is known.
        seconds:
          type: number
          description: Audiobook offset within the edition, not within the file.
        file_index:
          type: integer
          description: Which file of a multi-file audiobook.
        client_seq:
          type: integer
          format: int64
          description: The reporting device's own counter.
        updated_at:
          type: string
          format: date-time

    Progress:
      type: object
      required: [edition_id, positions, diverged]
      properties:
        edition_id:
          type: integer
          format: int64
        diverged:
          type: boolean
          description: |
            Two or more devices hold positions that did not follow from one
            another. Both are kept; resolving them is the client's to offer,
            and is deliberately never done silently.
        positions:
          type: array
          items:
            $ref: '#/components/schemas/Position'

    ProgressRequest:
      type: object
      required: [percent, client_seq]
      properties:
        percent:
          type: number
          minimum: 0
          maximum: 1
        client_seq:
          type: integer
          format: int64
          description: This device's counter, incremented on every save.
        cfi:
          type: [string, 'null']
        page:
          type: [integer, 'null']
        seconds:
          type: [number, 'null']
        file_index:
          type: [integer, 'null']

    ReaderState:
      type: object
      description: One book as it stands for the reader asking. Never another profile's.
      required: [book_id, reading_state]
      properties:
        book_id:
          type: integer
          format: int64
        reading_state:
          type: string
          enum: [unread, reading, finished, abandoned]
          description: Derived from progress and any hand-set mark.
        marked:
          type: string
          enum: [finished, abandoned]
          description: What was set by hand, when anything was.
        percent:
          type: number
        saved:
          type: boolean
        saved_at:
          type: string
          format: date-time
        rating:
          type: integer
        finished_at:
          type: string
          format: date-time

    HistoryEntry:
      type: object
      required: [book_id, title]
      properties:
        book_id:
          type: integer
          format: int64
        title:
          type: string
        finished_at:
          type: string
          format: date-time
        rating:
          type: integer

    SyncFile:
      type: object
      required: [id, ordinal, size_bytes, etag, content_url]
      properties:
        id:
          type: integer
          format: int64
        ordinal:
          type: integer
        size_bytes:
          type: integer
          format: int64
        etag:
          type: string
        content_url:
          type: string

    SyncEdition:
      type: object
      required: [book_id, edition_id, title, format, kind, reason, size_bytes, files]
      properties:
        book_id:
          type: integer
          format: int64
        edition_id:
          type: integer
          format: int64
        title:
          type: string
        format:
          type: string
        kind:
          type: string
          enum: [ebook, audiobook]
        reason:
          type: string
          enum: [reading, saved, next_in_series]
          description: Why this is worth holding, so a client can prioritise.
        size_bytes:
          type: integer
          format: int64
        files:
          type: array
          items:
            $ref: '#/components/schemas/SyncFile'

    SyncManifest:
      type: object
      required: [editions, reasons, total_bytes]
      properties:
        editions:
          type: array
          items:
            $ref: '#/components/schemas/SyncEdition'
        reasons:
          type: array
          description: Every reason this server may give, in priority order.
          items:
            type: string
        total_bytes:
          type: integer
          format: int64

    HandoffTarget:
      type: object
      required: [edition_id, format, kind, percent, chapters]
      properties:
        edition_id:
          type: integer
          format: int64
        format:
          type: string
        kind:
          type: string
          enum: [ebook, audiobook]
        percent:
          type: number
          description: Where this reader would arrive in this edition.
        chapters:
          type: integer
          description: How many chapters are known, which is what decides chapter alignment.

    HandoffRequest:
      type: object
      required: [to_edition_id]
      properties:
        to_edition_id:
          type: integer
          format: int64
        percent:
          type: [number, 'null']
          description: Omit to hand off from this reader's stored position.
        chapter_ordinal:
          type: [integer, 'null']
          description: Hand off from a chapter rather than a proportion.
        chapter_percent:
          type: number
          description: How far into that chapter, 0 to 1.

    Handoff:
      type: object
      required: [from_edition_id, to_edition_id, method, percent]
      properties:
        from_edition_id:
          type: integer
          format: int64
        to_edition_id:
          type: integer
          format: int64
        method:
          type: string
          enum: [chapter, percent]
          description: |
            `chapter` aligned both chapter lists and interpolated inside the
            match. `percent` is the fallback, and is the less precise of the
            two — worth saying so in a long audiobook.
        percent:
          type: number
        seconds:
          type: number
          description: Where to start, for an audiobook target.
        chapter_ordinal:
          type: integer
        chapter_title:
          type: string
        chapter_href:
          type: string
          description: Where to open, for an EPUB target.

    Collection:
      type: object
      required: [id, name, curated, book_count, created_at]
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        curated:
          type: boolean
          description: Admin-made and visible to everyone. Otherwise it is this reader's own.
        book_count:
          type: integer
          description: Counts only books this reader may see.
        created_at:
          type: string
          format: date-time

    CollectionRequest:
      type: object
      properties:
        name:
          type: [string, 'null']
        description:
          type: [string, 'null']
        curated:
          type: boolean
          description: Admin-only. Ignored otherwise.

    Annotation:
      type: object
      required: [uuid, edition_id, kind, seq, created_at, updated_at]
      properties:
        uuid:
          type: string
          format: uuid
        edition_id:
          type: integer
          format: int64
        kind:
          type: string
          enum: [highlight, note, bookmark]
        cfi:
          type: string
        cfi_end:
          type: string
          description: The far end of a highlight.
        page:
          type: integer
        seconds:
          type: number
        percent:
          type: number
        quote:
          type: string
          description: The text as it stood when highlighted.
        note:
          type: string
        deleted:
          type: boolean
          description: A tombstone, so a device that was away stops holding it.
        seq:
          type: integer
          format: int64
          description: Server-assigned order, and what `since` walks.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    AnnotationRequest:
      type: object
      required: [edition_id, kind]
      properties:
        edition_id:
          type: integer
          format: int64
        kind:
          type: string
          enum: [highlight, note, bookmark]
        cfi:
          type: [string, 'null']
        cfi_end:
          type: [string, 'null']
        page:
          type: [integer, 'null']
        seconds:
          type: [number, 'null']
        percent:
          type: [number, 'null']
        quote:
          type: string
        note:
          type: string

    CreateUploadRequest:
      type: object
      required: [source_id, filename, format, total_bytes, sha256]
      properties:
        source_id:
          type: integer
          format: int64
          description: Which source directory to ingest into.
        filename:
          type: string
        format:
          type: string
          enum: [epub, pdf, m4b, mp3]
        total_bytes:
          type: integer
          format: int64
        sha256:
          type: string
          description: Hex digest of the whole file, verified on finalize.

    Upload:
      type: object
      required: [id, filename, format, total_bytes, chunk_bytes, state, missing_chunks]
      properties:
        id:
          type: string
        filename:
          type: string
        format:
          type: string
        total_bytes:
          type: integer
          format: int64
        chunk_bytes:
          type: integer
          format: int64
          description: The size to send. Resume is defined in whole chunks of this.
        state:
          type: string
          enum: [open, complete, failed]
        missing_chunks:
          type: array
          description: Byte offsets still wanted. Empty means ready to finalize.
          items:
            type: integer
            format: int64
        error:
          type: string
          description: Why it failed, when state is failed.

    Candidate:
      type: object
      required: [provider, id, title, score, would_match_automatically]
      properties:
        provider:
          type: string
          enum: [openlibrary, googlebooks, audnexus]
        id:
          type: string
          description: Provider-local, and what to send back to apply it.
        title:
          type: string
        subtitle:
          type: string
        authors:
          type: array
          items:
            type: string
        year:
          type: integer
        isbn:
          type: string
        asin:
          type: string
        cover_url:
          type: string
        score:
          type: number
        would_match_automatically:
          type: boolean
          description: |
            False for candidates the matcher refused. They are listed anyway,
            because a person can recognise a match a score cannot.

    ApplyMatchRequest:
      type: object
      required: [provider, id]
      properties:
        provider:
          type: string
        id:
          type: string
        edition_id:
          type: integer
          format: int64
        q:
          type: string
          description: The search that produced the candidate, for re-finding it.
        author:
          type: string

    UncertainGrouping:
      type: object
      required: [book_id, book_title, edition_id, format, confidence]
      properties:
        book_id:
          type: integer
          format: int64
        book_title:
          type: string
        edition_id:
          type: integer
          format: int64
        format:
          type: string
        confidence:
          type: number
          description: How sure the matcher was, below the threshold for certain.
        reason:
          type: string

    Grouping:
      type: object
      required: [edition_id, book_id]
      properties:
        edition_id:
          type: integer
          format: int64
        book_id:
          type: integer
          format: int64

    Override:
      type: object
      required: [user_id, book_id, allowed]
      properties:
        user_id:
          type: integer
          format: int64
        book_id:
          type: integer
          format: int64
        allowed:
          type: boolean

    FacetValue:
      type: object
      required: [value, label, count]
      properties:
        value:
          type: string
          description: What to send back as a filter. Not always human-readable — an author is an id.
        label:
          type: string
          description: What to show.
        count:
          type: integer
