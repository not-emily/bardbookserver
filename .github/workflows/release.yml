name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # A tag that cannot pass its own tests is not a release.
      - name: go test
        run: CGO_ENABLED=1 go test -race -count=1 ./...

      - name: Build the artefacts
        run: ./scripts/release

      # gh ships on the runner, so the release needs no third-party action.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes \
            dist/bard-linux-amd64.tar.gz \
            dist/bard-linux-arm64.tar.gz \
            dist/checksums.txt
